name: Windows desktop package

on:
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/windows-package.yml'
  push:
    branches: [main]
    tags:
      - 'v*'
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve application version
        shell: pwsh
        run: |
          $version = mvn help:evaluate -Dexpression=project.version -q -DforceStdout
          if (-not $version) { throw "Could not resolve Maven project version." }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Packaging MechMotor version $version"

      - name: Verify tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Assemble desktop distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/dist | Out-Null
          mvn --batch-mode --no-transfer-progress dependency:copy-dependencies "-DincludeScope=runtime" "-DoutputDirectory=target/dist"
          jar --create --file target/dist/mechmotor.jar -C target/classes .

      - name: Build trimmed Java runtime with JavaFX
        shell: pwsh
        run: |
          # Keep Spring/third-party automatic modules off jlink's module path.
          # Only the JDK modules and the platform-specific JavaFX modules belong here.
          $javafxJars = Get-ChildItem "target/dist" -Filter "javafx-*-win.jar" |
            Where-Object { $_.Name -notmatch "sources|javadoc" } |
            ForEach-Object { $_.FullName }
          if (-not $javafxJars -or $javafxJars.Count -lt 3) {
            Get-ChildItem "target/dist" -Filter "javafx*.jar" | Select-Object -ExpandProperty Name
            throw "Expected platform-specific JavaFX module JARs were not copied to target/dist."
          }
          $modulePath = @("$env:JAVA_HOME\jmods") + $javafxJars
          $modulePathArg = $modulePath -join ";"
          jlink --module-path $modulePathArg --add-modules java.se,javafx.controls,jdk.crypto.ec --strip-debug --no-man-pages --no-header-files --compress=2 --output target/runtime
          if ($LASTEXITCODE -ne 0) { throw "jlink failed to build the trimmed JavaFX runtime." }
          if (-not (Test-Path "target/runtime/bin/java.exe")) {
            throw "jlink did not produce target/runtime/bin/java.exe."
          }
          & "target/runtime/bin/java.exe" -version
          if ($LASTEXITCODE -ne 0) { throw "The generated runtime cannot execute Java." }

      - name: Build Windows app image
        shell: pwsh
        run: |
          jpackage --type app-image --name MechMotor --app-version $env:APP_VERSION --input target/dist --main-jar mechmotor.jar --main-class com.mechmotor.DesktopLauncher --java-options "--add-modules=javafx.controls" --runtime-image target/runtime --dest target/installer
          $launcher = "target/installer/MechMotor/MechMotor.exe"
          if (-not (Test-Path $launcher)) {
            throw "jpackage did not produce the expected MechMotor.exe launcher."
          }
          $bundledJava = "target/installer/MechMotor/runtime/bin/java.exe"
          if (-not (Test-Path $bundledJava)) {
            throw "The app image is missing its bundled Java runtime: $bundledJava"
          }
          if (-not (Get-ChildItem "target/installer/MechMotor/app" -Filter "*.jar" -ErrorAction SilentlyContinue)) {
            throw "The app image is missing packaged application/dependency JARs."
          }
          Compress-Archive -Path target/installer/MechMotor -DestinationPath target/MechMotor-Windows-x64-app-image.zip -Force

      - name: Verify packaged JVM and launcher configuration
        shell: pwsh
        run: |
          $root = (Resolve-Path "target/installer/MechMotor").Path
          $launcher = Join-Path $root "MechMotor.exe"
          $runtimeJava = Join-Path $root "runtime/bin/java.exe"
          $config = Join-Path $root "app/MechMotor.cfg"
          $appJar = Join-Path $root "app/mechmotor.jar"
          foreach ($required in @($launcher, $runtimeJava, $config, $appJar)) {
            if (-not (Test-Path $required)) {
              throw "Incomplete jpackage app image: required file missing: $required"
            }
          }
          $cfgText = Get-Content -Raw $config
          if ($cfgText -notmatch '(?m)^app\.mainclass=com\.mechmotor\.DesktopLauncher\s*$') {
            throw "MechMotor.cfg does not declare the expected DesktopLauncher main class."
          }
          if ($cfgText -notmatch '(?m)^app\.classpath=') {
            throw "MechMotor.cfg has no application classpath; JVM launch would be incomplete."
          }
          & $runtimeJava -version
          if ($LASTEXITCODE -ne 0) { throw "The bundled Java runtime cannot execute java.exe." }
          Write-Host "Validated launcher, bundled Java runtime, main class, and classpath."
          Get-Content $config

      - name: Smoke-test packaged app launch
        shell: pwsh
        run: |
          $logDir = "target/launch-logs"
          New-Item -ItemType Directory -Force $logDir | Out-Null
          $stdout = Join-Path $logDir "app-image.stdout.log"
          $stderr = Join-Path $logDir "app-image.stderr.log"
          $process = Start-Process -FilePath "target/installer/MechMotor/MechMotor.exe" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          Start-Sleep -Seconds 15
          $process.Refresh()
          if ($process.HasExited) {
            Write-Host "Launcher stdout:"
            if (Test-Path $stdout) { Get-Content $stdout }
            Write-Host "Launcher stderr:"
            if (Test-Path $stderr) { Get-Content $stderr }
            throw "MechMotor exited during the 15-second packaged-launch smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wixRoot = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3.*" -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wixRoot) {
            throw "WiX Toolset v3 installation directory was not found after installation."
          }
          $wixBin = Join-Path $wixRoot.FullName "bin"
          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "WiX Toolset candle.exe was not found in $wixBin."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Build EXE and MSI installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/packages/exe, target/packages/msi | Out-Null
          jpackage --type exe --name MechMotor --app-version $env:APP_VERSION --input target/dist --main-jar mechmotor.jar --main-class com.mechmotor.DesktopLauncher --java-options "--add-modules=javafx.controls" --runtime-image target/runtime --dest target/packages/exe --win-menu --win-shortcut --win-upgrade-uuid "5a89bc09-8542-4143-8aef-5db0148356e5"
          jpackage --type msi --name MechMotor --app-version $env:APP_VERSION --input target/dist --main-jar mechmotor.jar --main-class com.mechmotor.DesktopLauncher --java-options "--add-modules=javafx.controls" --runtime-image target/runtime --dest target/packages/msi --win-menu --win-shortcut --win-upgrade-uuid "5a89bc09-8542-4143-8aef-5db0148356e5"
          if (-not (Test-Path "target/packages/exe/MechMotor-$env:APP_VERSION.exe")) {
            throw "jpackage did not produce the expected EXE installer."
          }
          if (-not (Test-Path "target/packages/msi/MechMotor-$env:APP_VERSION.msi")) {
            throw "jpackage did not produce the expected MSI installer."
          }


      - name: Sign Windows installers when certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
            Write-Warning "Windows signing secrets are not configured; installers will remain unsigned."
            exit 0
          }

          $certPath = Join-Path $env:RUNNER_TEMP "mechmotor-signing.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))

          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signTool) { throw "signtool.exe was not found on the Windows runner." }

          $packages = @(
            "target/packages/exe/MechMotor-$env:APP_VERSION.exe",
            "target/packages/msi/MechMotor-$env:APP_VERSION.msi"
          )
          foreach ($package in $packages) {
            if (-not (Test-Path $package)) { throw "Package to sign was not found: $package" }
            & $signTool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $package
            if ($LASTEXITCODE -ne 0) { throw "Code signing failed for $package" }
            & $signTool.FullName verify /pa /v $package
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $package" }
          }

          Remove-Item $certPath -Force -ErrorAction SilentlyContinue

      - name: Seed legacy user database before installer acceptance
        shell: pwsh
        run: java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java seed

      - name: Apply and verify legacy database migrations
        shell: pwsh
        run: |
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java migrate
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

      - name: Validate MSI install, launch, and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path "target/packages/msi/MechMotor-$env:APP_VERSION.msi").Path
          $install = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "MSI install failed with exit code $($install.ExitCode)."
          }

          $uninstallKeys = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "MechMotor*" } |
            Select-Object -First 1
          $candidates = @()
          if ($entry -and $entry.InstallLocation) {
            $candidates += (Join-Path $entry.InstallLocation "MechMotor.exe")
          }
          $candidates += (Join-Path $env:ProgramFiles "MechMotor\MechMotor.exe")
          $launcher = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $launcher) {
            throw "MSI installation completed, but MechMotor.exe was not found in the installed location."
          }
          $installRoot = Split-Path $launcher -Parent
          $runtimeJava = Join-Path $installRoot "runtime/bin/java.exe"
          $config = Join-Path $installRoot "app/MechMotor.cfg"
          if (-not (Test-Path $runtimeJava) -or -not (Test-Path $config)) {
            throw "MSI installation is missing its bundled Java runtime or MechMotor.cfg."
          }
          if ((Get-Content -Raw $config) -notmatch '(?m)^app\.mainclass=com\.mechmotor\.DesktopLauncher\s*$') {
            throw "Installed MSI launcher configuration points to the wrong main class."
          }
          & $runtimeJava -version
          if ($LASTEXITCODE -ne 0) { throw "Installed MSI bundled Java runtime failed its version check." }

          $app = Start-Process -FilePath $launcher -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) {
            throw "Installed MechMotor exited during the 10-second launch smoke test (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

          $uninstall = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/x", "`"$msi`"", "/qn", "/norestart") -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path $launcher) {
            throw "MechMotor launcher remains after MSI uninstall: $launcher"
          }
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

      - name: Validate EXE installer install, launch, and uninstall
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/packages/exe/MechMotor-$env:APP_VERSION.exe").Path
          $install = Start-Process -FilePath $exe -ArgumentList @("/quiet", "/norestart") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "EXE installer failed with exit code $($install.ExitCode)."
          }

          $uninstallKeys = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "MechMotor*" } |
            Select-Object -First 1
          $candidates = @()
          if ($entry -and $entry.InstallLocation) {
            $candidates += (Join-Path $entry.InstallLocation "MechMotor.exe")
          }
          $candidates += (Join-Path $env:ProgramFiles "MechMotor\MechMotor.exe")
          $launcher = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $launcher) {
            throw "EXE installer completed, but MechMotor.exe was not found in the installed location."
          }
          $installRoot = Split-Path $launcher -Parent
          $runtimeJava = Join-Path $installRoot "runtime/bin/java.exe"
          $config = Join-Path $installRoot "app/MechMotor.cfg"
          if (-not (Test-Path $runtimeJava) -or -not (Test-Path $config)) {
            throw "EXE installation is missing its bundled Java runtime or MechMotor.cfg."
          }
          if ((Get-Content -Raw $config) -notmatch '(?m)^app\.mainclass=com\.mechmotor\.DesktopLauncher\s*$') {
            throw "Installed EXE launcher configuration points to the wrong main class."
          }
          & $runtimeJava -version
          if ($LASTEXITCODE -ne 0) { throw "Installed EXE bundled Java runtime failed its version check." }

          $app = Start-Process -FilePath $launcher -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) {
            throw "EXE-installed MechMotor exited during the 10-second launch smoke test (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

          $entry = Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "MechMotor*" } |
            Select-Object -First 1
          if (-not $entry) {
            throw "Could not find MechMotor uninstall registry entry after EXE installation."
          }
          $uninstallText = if ($entry.QuietUninstallString) { $entry.QuietUninstallString } else { $entry.UninstallString }
          if (-not $uninstallText) {
            throw "MechMotor uninstall command was not registered."
          }
          if ($uninstallText -match '(?i)msiexec(?:\.exe)?\s+.*?(/i|/package)\s*(\{[0-9A-F-]+\})') {
            $productCode = $Matches[2]
            $uninstall = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/x", $productCode, "/qn", "/norestart") -Wait -PassThru
          } else {
            $command = $uninstallText.Trim()
            $uninstaller = $null
            $arguments = ""
            if ($command -match '^"([^"]+)"\s*(.*)$') {
              $uninstaller = $Matches[1]
              $arguments = $Matches[2]
            } elseif ($command -match '^([^\s]+)\s*(.*)$') {
              $uninstaller = $Matches[1]
              $arguments = $Matches[2]
            }
            if (-not $uninstaller -or -not (Test-Path $uninstaller)) {
              throw "Could not resolve registered MechMotor uninstaller: $uninstallText"
            }
            if ($arguments -notmatch '(?i)(/quiet|/qn|/silent|/s\b)') {
              $arguments = "$arguments /quiet"
            }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList $arguments -Wait -PassThru
          }
          if ($uninstall.ExitCode -notin @(0, 3010, 1605, 1614)) {
            throw "EXE-installed MechMotor uninstall failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path $launcher) {
            throw "MechMotor launcher remains after EXE installer uninstall: $launcher"
          }
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $files = @(
            "target/packages/exe/MechMotor-$env:APP_VERSION.exe",
            "target/packages/msi/MechMotor-$env:APP_VERSION.msi",
            "target/MechMotor-Windows-x64-app-image.zip"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing package for checksum: $file" }
            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash.ToLowerInvariant())  $file"
          }
          $lines | Set-Content -Encoding ascii target/SHA256SUMS.txt

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: MechMotor-Windows-x64-installers
          path: |
            target/MechMotor-Windows-x64-app-image.zip
            target/packages/exe/MechMotor-$env:APP_VERSION.exe
            target/packages/msi/MechMotor-$env:APP_VERSION.msi
            target/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $expectedTag = "v$env:APP_VERSION"
          if ("$env:GITHUB_REF_NAME" -ne $expectedTag) {
            throw "Release tag $env:GITHUB_REF_NAME does not match Maven version $expectedTag."
          }
          gh release create "$env:GITHUB_REF_NAME" "target/packages/exe/MechMotor-$env:APP_VERSION.exe" "target/packages/msi/MechMotor-$env:APP_VERSION.msi" "target/SHA256SUMS.txt" --title "MechMotor $env:APP_VERSION" --generate-notes
