name: Windows desktop package

on:
  pull_request:
    branches: [main]
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'tools/**'
      - 'README.md'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Assemble desktop distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/dist | Out-Null
          mvn --batch-mode --no-transfer-progress dependency:copy-dependencies "-DincludeScope=runtime" "-DoutputDirectory=target/dist"
          jar --create --file target/dist/mechmotor.jar -C target/classes .

      - name: Build Windows app image
        shell: pwsh
        run: |
          jpackage --type app-image --name MechMotor --app-version 1.0.0 --input target/dist --main-jar mechmotor.jar --main-class com.mechmotor.DesktopLauncher --module-path target/dist --add-modules javafx.controls --dest target/installer
          $launcher = "target/installer/MechMotor/MechMotor.exe"
          if (-not (Test-Path $launcher)) {
            throw "jpackage did not produce the expected MechMotor.exe launcher."
          }
          $bundledJava = "target/installer/MechMotor/runtime/bin/java.exe"
          if (-not (Test-Path $bundledJava)) {
            throw "The app image is missing its bundled Java runtime: $bundledJava"
          }
          if (-not (Get-ChildItem "target/installer/MechMotor/app" -Filter "*.jar" -ErrorAction SilentlyContinue)) {
            throw "The app image is missing packaged application/dependency JARs."
          }
          Compress-Archive -Path target/installer/MechMotor -DestinationPath target/MechMotor-Windows-x64-app-image.zip -Force

      - name: Smoke-test packaged app launch
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "target/installer/MechMotor/MechMotor.exe" -PassThru
          Start-Sleep -Seconds 12
          $process.Refresh()
          if ($process.HasExited) {
            throw "MechMotor exited during the 12-second packaged-launch smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $wixRoot = Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset v3.*" -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if (-not $wixRoot) {
            throw "WiX Toolset v3 installation directory was not found after installation."
          }
          $wixBin = Join-Path $wixRoot.FullName "bin"
          if (-not (Test-Path (Join-Path $wixBin "candle.exe"))) {
            throw "WiX Toolset candle.exe was not found in $wixBin."
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Build EXE and MSI installers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target/packages/exe, target/packages/msi | Out-Null
          jpackage --type exe --name MechMotor --app-version 1.0.0 --input target/dist --main-jar mechmotor.jar --main-class com.mechmotor.DesktopLauncher --module-path target/dist --add-modules javafx.controls --dest target/packages/exe --win-menu --win-shortcut
          jpackage --type msi --name MechMotor --app-version 1.0.0 --input target/dist --main-jar mechmotor.jar --main-class com.mechmotor.DesktopLauncher --module-path target/dist --add-modules javafx.controls --dest target/packages/msi --win-menu --win-shortcut
          if (-not (Test-Path "target/packages/exe/MechMotor-1.0.0.exe")) {
            throw "jpackage did not produce the expected EXE installer."
          }
          if (-not (Test-Path "target/packages/msi/MechMotor-1.0.0.msi")) {
            throw "jpackage did not produce the expected MSI installer."
          }


      - name: Seed legacy user database before installer acceptance
        shell: pwsh
        run: java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java seed

      - name: Apply and verify legacy database migrations
        shell: pwsh
        run: |
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java migrate
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

      - name: Validate MSI install, launch, and uninstall
        shell: pwsh
        run: |
          $msi = (Resolve-Path "target/packages/msi/MechMotor-1.0.0.msi").Path
          $install = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "MSI install failed with exit code $($install.ExitCode)."
          }

          $uninstallKeys = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "MechMotor*" } |
            Select-Object -First 1
          $candidates = @()
          if ($entry -and $entry.InstallLocation) {
            $candidates += (Join-Path $entry.InstallLocation "MechMotor.exe")
          }
          $candidates += (Join-Path $env:ProgramFiles "MechMotor\MechMotor.exe")
          $launcher = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $launcher) {
            throw "MSI installation completed, but MechMotor.exe was not found in the installed location."
          }

          $app = Start-Process -FilePath $launcher -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) {
            throw "Installed MechMotor exited during the 10-second launch smoke test (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

          $uninstall = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/x", "`"$msi`"", "/qn", "/norestart") -Wait -PassThru
          if ($uninstall.ExitCode -notin @(0, 3010)) {
            throw "MSI uninstall failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path $launcher) {
            throw "MechMotor launcher remains after MSI uninstall: $launcher"
          }
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

      - name: Validate EXE installer install, launch, and uninstall
        shell: pwsh
        run: |
          $exe = (Resolve-Path "target/packages/exe/MechMotor-1.0.0.exe").Path
          $install = Start-Process -FilePath $exe -ArgumentList @("/quiet", "/norestart") -Wait -PassThru
          if ($install.ExitCode -notin @(0, 3010)) {
            throw "EXE installer failed with exit code $($install.ExitCode)."
          }

          $uninstallKeys = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $entry = Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "MechMotor*" } |
            Select-Object -First 1
          $candidates = @()
          if ($entry -and $entry.InstallLocation) {
            $candidates += (Join-Path $entry.InstallLocation "MechMotor.exe")
          }
          $candidates += (Join-Path $env:ProgramFiles "MechMotor\MechMotor.exe")
          $launcher = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $launcher) {
            throw "EXE installer completed, but MechMotor.exe was not found in the installed location."
          }

          $app = Start-Process -FilePath $launcher -PassThru
          Start-Sleep -Seconds 10
          $app.Refresh()
          if ($app.HasExited) {
            throw "EXE-installed MechMotor exited during the 10-second launch smoke test (exit code $($app.ExitCode))."
          }
          Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

          $entry = Get-ItemProperty $uninstallKeys -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -like "MechMotor*" } |
            Select-Object -First 1
          if (-not $entry) {
            throw "Could not find MechMotor uninstall registry entry after EXE installation."
          }
          $uninstallText = if ($entry.QuietUninstallString) { $entry.QuietUninstallString } else { $entry.UninstallString }
          if (-not $uninstallText) {
            throw "MechMotor uninstall command was not registered."
          }
          if ($uninstallText -match '(?i)msiexec(?:\.exe)?\s+.*?(/i|/package)\s*(\{[0-9A-F-]+\})') {
            $productCode = $Matches[2]
            $uninstall = Start-Process -FilePath "msiexec.exe" -ArgumentList @("/x", $productCode, "/qn", "/norestart") -Wait -PassThru
          } else {
            $command = $uninstallText.Trim()
            $uninstaller = $null
            $arguments = ""
            if ($command -match '^"([^"]+)"\s*(.*)$') {
              $uninstaller = $Matches[1]
              $arguments = $Matches[2]
            } elseif ($command -match '^([^\s]+)\s*(.*)$') {
              $uninstaller = $Matches[1]
              $arguments = $Matches[2]
            }
            if (-not $uninstaller -or -not (Test-Path $uninstaller)) {
              throw "Could not resolve registered MechMotor uninstaller: $uninstallText"
            }
            if ($arguments -notmatch '(?i)(/quiet|/qn|/silent|/s\b)') {
              $arguments = "$arguments /quiet"
            }
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList $arguments -Wait -PassThru
          }
          if ($uninstall.ExitCode -notin @(0, 3010, 1605, 1614)) {
            throw "EXE-installed MechMotor uninstall failed with exit code $($uninstall.ExitCode)."
          }
          if (Test-Path $launcher) {
            throw "MechMotor launcher remains after EXE installer uninstall: $launcher"
          }
          java -cp "target/dist/*" tools/acceptance/WindowsDatabaseLifecycle.java verify

      - name: Generate installer checksums
        shell: pwsh
        run: |
          $files = @(
            "target/packages/exe/MechMotor-1.0.0.exe",
            "target/packages/msi/MechMotor-1.0.0.msi",
            "target/MechMotor-Windows-x64-app-image.zip"
          )
          $lines = foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing package for checksum: $file" }
            $hash = Get-FileHash -Algorithm SHA256 $file
            "$($hash.Hash.ToLowerInvariant())  $file"
          }
          $lines | Set-Content -Encoding ascii target/SHA256SUMS.txt

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: MechMotor-Windows-x64-installers
          path: |
            target/MechMotor-Windows-x64-app-image.zip
            target/packages/exe/MechMotor-1.0.0.exe
            target/packages/msi/MechMotor-1.0.0.msi
            target/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
